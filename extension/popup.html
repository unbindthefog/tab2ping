<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>tab2ping</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Palette, keys, lamps and footer: style.css (copied from tab2tv). */
  body { font: 9px/1.4 var(--mono); width: 173px; margin: 0; padding: 8px; color: var(--text); background: var(--bg); }
  /* Host of the active tab with a live dot, above the keys. */
  .status { display: flex; align-items: center; gap: 6px; margin: 0 2px 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--disabled); flex: none; }
  .dot.up { background: var(--on); } .dot.error { background: var(--info); } .dot.timeout { background: var(--off); }
  #host { font-weight: 600; color: var(--strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #ms { color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #note { margin: 8px 2px 0; color: var(--text); }
  #note:empty { display: none; }
</style>
</head>
<body>
<div class="status"><span class="dot" id="dot"></span><span id="host">…</span><span id="ms"></span></div>
<!-- One column per way of pinging: the way on top, its AUTO key below. -->
<div class="panel">
  <button class="key" id="browser" type="button" title="Ping-Fenster öffnen">BROWSER<span class="lamp" id="browserLamp"></span></button>
  <button class="key" id="terminal" type="button" title="Ping im Terminal">TERMINAL<span class="lamp" id="terminalLamp"></span></button>
  <button class="key" id="autoBrowser" type="button" title="Ping-Fenster folgt dem aktiven Tab">AUTO<span class="lamp" id="autoBrowserLamp"></span></button>
  <button class="key" id="autoTerminal" type="button" title="Terminal folgt dem aktiven Tab (braucht den Helfer)">AUTO<span class="lamp" id="autoTerminalLamp"></span></button>
</div>
<div id="note"></div>
<footer class="footer"><h1>tab2ping</h1><span class="version" id="version"></span></footer>
<script src="popup.js"></script>
</body>
</html>
